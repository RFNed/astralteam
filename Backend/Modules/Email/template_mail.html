<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
<title>Подтверждение регистрации</title>

</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #ffffff;
    font-family: Arial, sans-serif;
">
<table
    width="100%"
    cellpadding="0"
    cellspacing="0"
    border="0"
    style="
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #ffffff;
    "
>
    <tr>
        <td align="center" style="padding: 30px 15px; font-family: 'Unbounded', cursive;">
            <table
                width="560"
                cellpadding="0"
                cellspacing="0"
                border="0"
                style="
                    width: 560px;
                    max-width: 100%;
                    background-color: #444444;
                    border-radius: 20px;
                    overflow: hidden;
                "
            >
                <tr>
                    <td
                        align="center"
                        valign="middle"
                        height="180"
                        style="
                            height: 180px;
                            background-color: #242424;
                            text-align: center;
                        "
                    >
                        <img
                            src="{{image_path}}"
                            width="240"
                            style="
                                display: block;
                                width: 240px;
                                max-width: 100%;
                                height: auto;
                                margin: 0 auto;
                                border: 0;
                            "
                        >
                    </td>
                </tr>
                <tr>
                    <td
                        align="center"
                        style="
                            padding: 35px 30px 0 30px;
                            color: #ffffff;
                            font-size: 15px;
                            line-height: 1.6;
                            text-align: center;
                        "
                    >
                        <strong style="
                            display: block;
                            font-weight: bold;
                            margin-bottom: 8px;
                        ">
                            Спасибо за регистрацию на нашем сайте!
                        </strong>

                        Пожалуйста, подтвердите ваш email,
                        чтобы завершить регистрацию.
                    </td>
                </tr>
                <tr>
                    <td
                        align="center"
                        style="
                            padding: 20px 30px 40px 30px;
                            text-align: center;

                        "
                    >
                        <a
                            href="{{link}}"
                            style="
                                display: inline-block;
                                padding: 12px 24px;
                                background-color: #ffffff;
                                color: #242424;
                                text-decoration: none;
                                font-size: 14px;
                                font-weight: bold;
                                border-radius: 8px;
                            "
                        >
                            Перейти к подтверждению
                        </a>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>
</body>
</html>
