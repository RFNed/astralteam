<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <style>
        .main {
            width: 500px;
            height: 600px;
            text-align: center;
            justify-self: center;
            align-items: center;
            overflow: hidden;
            background-color: rgb(68, 68, 68);
            padding: 30px;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            color: white;
            font-family: 'Unbounded', cursive;
            user-select: none;
        }

        .head-main {
            width: 570px;
            height: 180px;
            justify-content: center;
            align-items: center;
            display: flex;
            background-color: rgb(36, 36, 36);
            overflow: hidden;
        }


        .head-main img {
            height: auto;
            width: 240px;
            display: flex;
            filter: drop-shadow(0px 0px 20px rgba(231, 229, 229, 0.4));
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="head-main">
            <img src='{{image_path}}'></img>
        </div>
        <div style="margin-top: 35px;">
            <span style="font-weight: bolder;">Спасибо за регистрацию на нашем сайте!</span>
            Пожалуйста, подтвердите ваш email, чтобы завершить регистрацию.
        </div>
        <div style="margin-top: 20px;">
            <a href="{{link}}" style="color: white; text-decoration: underline;">Перейдите по ссылке</a>
        </div>
    </div>
</body>

</html>
