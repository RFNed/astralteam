name: astralteam-CI

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
      - name: Check backend 
        working-directory: backend
        run: |
          python -m compileall .
  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      working-directory: frontend
      run: npm ci
    - name: Running Build Frontend
      working-directory: frontend
      run: npm run build
        
