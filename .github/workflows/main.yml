name: astralteam-CI

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          go-version-file: 'backend/go.mod'
      - name: Make build
        run: go build ./cmd/server
        working-directory: backend
  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      working-directory: frontend
      run: npm ci
    - name: Running Build Frontend
      working-directory: frontend
      run: npm run build
        
